name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: combustivel_cwb_sjp_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, curl, libxml, pgsql, pdo_pgsql, bcmath, gd
        coverage: none

    - name: Install Dependencies
      run: |
        cd src
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copy .env
      run: |
        cd src
        php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate key
      run: |
        cd src
        php artisan key:generate

    - name: Directory Permissions
      run: |
        cd src
        chmod -R 777 storage bootstrap/cache

    - name: Run Pint (Lint)
      run: |
        cd src
        ./vendor/bin/pint --test

    - name: Run Larastan (Static Analysis)
      run: |
        cd src
        ./vendor/bin/phpstan analyze

    - name: Run Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: combustivel_cwb_sjp_test
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: |
        cd src
        php artisan test
